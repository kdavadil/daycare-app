<style>
#sibol{--s-bg:light-dark(#faf8f2,#192821);--s-paper:light-dark(#ffffff,#24372e);--s-ink:light-dark(#253c31,#edf2e9);--s-muted:light-dark(#6b786e,#aebdb1);--s-line:light-dark(#e5e9e0,#3b4e42);--s-green:light-dark(#286446,#9fd3ad);--s-soft:light-dark(#eaf0df,#354936);--s-yellow:light-dark(#faedc7,#51462e);font-family:'Nunito Sans',system-ui,sans-serif;color:var(--s-ink);max-width:430px;margin:0 auto;background:var(--s-bg);border:1px solid var(--s-line);border-radius:30px;overflow:hidden;position:relative;font-size:14px;line-height:1.5}#sibol *{box-sizing:border-box}#sibol button,#sibol input,#sibol select{font:inherit}#sibol button{cursor:pointer;color:inherit}#sibol button:focus-visible{outline:3px solid #d99247;outline-offset:2px}#sibol .top{padding:18px 23px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--s-line);background:var(--s-paper)}#sibol .brand{font-size:27px;letter-spacing:-1.4px;font-weight:700;display:flex;align-items:center;gap:7px;color:var(--s-green)}#sibol .brand svg{width:26px;height:26px}#sibol .school{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--s-muted)}#sibol .iconbutton{border:1px solid var(--s-line);background:var(--s-paper);border-radius:50%;width:44px;height:44px;display:grid;place-items:center}#sibol .content{padding:24px 22px;min-height:640px}#sibol h1{font-size:29px;letter-spacing:-1px;line-height:1.2;margin:6px 0 9px;font-weight:650}#sibol h2{font-size:17px;letter-spacing:-.3px;margin:0;font-weight:650}#sibol p{margin:6px 0}#sibol .muted{color:var(--s-muted);font-size:12px}#sibol .eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:650;color:var(--s-muted)}#sibol .row{display:flex;align-items:center;gap:12px}#sibol .between{justify-content:space-between}#sibol .grow{flex:1;min-width:0}#sibol .panel{padding:17px;background:var(--s-paper);border:1px solid var(--s-line);border-radius:20px;margin-top:18px}#sibol .avatar{display:grid;place-items:center;width:48px;height:48px;flex-shrink:0;border-radius:16px;background:var(--s-yellow);font-size:24px}#sibol .tag{display:inline-flex;gap:5px;align-items:center;background:var(--s-soft);color:var(--s-green);font-size:11px;padding:4px 9px;border-radius:20px}#sibol .child{background:var(--s-soft);border:0;padding:19px;margin-top:22px}#sibol .child .tag{background:var(--s-paper)}#sibol .rule{height:1px;background:var(--s-line);margin:15px 0}#sibol .action{border:0;background:var(--s-green);color:var(--s-bg);border-radius:13px;min-height:46px;padding:10px 16px;font-weight:600;width:100%;margin-top:14px}#sibol .link{border:0;background:transparent;color:var(--s-green);font-weight:600;padding:10px 0;min-height:44px}#sibol .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 24px}#sibol .quick button{background:var(--s-paper);border:1px solid var(--s-line);border-radius:14px;padding:13px;display:flex;align-items:center;gap:9px;font-size:12px}#sibol .quick svg{width:19px;height:19px;color:var(--s-green)}#sibol .event{padding:15px 0;border-bottom:1px solid var(--s-line);align-items:flex-start}#sibol .event:last-child{border:0;padding-bottom:0}#sibol .eventicon{width:35px;height:35px;display:grid;place-items:center;background:var(--s-soft);border-radius:12px;flex-shrink:0;color:var(--s-green)}#sibol .eventicon svg{width:17px;height:17px}#sibol .event strong{font-weight:600;font-size:13px}#sibol .event time{font-size:11px;color:var(--s-muted);white-space:nowrap}#sibol .notice{background:var(--s-yellow);border:0}#sibol .nav{display:grid;grid-template-columns:repeat(5,1fr);padding:10px 8px 16px;border-top:1px solid var(--s-line);background:var(--s-paper)}#sibol .nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:none;border:0;font-size:10px;color:var(--s-muted);min-height:48px;border-radius:12px}#sibol .nav button.active{color:var(--s-green);background:var(--s-soft);font-weight:650}#sibol .nav svg{width:21px;height:21px}#sibol .postart{height:155px;background:light-dark(#ecdfc6,#4c4833);border-radius:14px;margin:14px 0;display:flex;justify-content:center;align-items:flex-end;gap:9px;padding:24px;position:relative;overflow:hidden}#sibol .block{width:45px;height:45px;background:#c87e60;border-radius:5px;box-shadow:inset -6px -6px 0 #0000000d}#sibol .block.tall{height:84px;background:#7e9471}#sibol .block.round{border-radius:50%;background:#e4b956}#sibol .block.blue{background:#7b9fa8;height:65px}#sibol .sun{position:absolute;width:42px;height:42px;border-radius:50%;background:#f8cf75;top:19px;right:26px}#sibol .bubble{padding:15px 17px;border-radius:18px 18px 18px 3px;background:var(--s-paper);border:1px solid var(--s-line);margin:16px 28px 5px 0}#sibol .bubble.mine{background:var(--s-soft);border:0;margin:14px 0 5px 30px;border-radius:18px 18px 3px 18px}#sibol .compose{display:flex;gap:8px;margin-top:22px}#sibol input,#sibol select{min-width:0;width:100%;background:var(--s-paper);color:var(--s-ink);border:1px solid var(--s-line);border-radius:12px;padding:12px;font-size:16px}#sibol .compose button{width:48px;flex-shrink:0;margin:0;padding:10px}#sibol .amount{font-size:38px;letter-spacing:-1.5px;font-weight:650;margin:8px 0}#sibol .invoice{padding:11px 0;font-size:13px}#sibol .label{display:block;margin:16px 0 7px;font-size:12px;color:var(--s-muted)}#sibol .back{padding:0 0 15px;display:flex;align-items:center;gap:6px}#sibol .toast{margin-top:15px;padding:12px 14px;border-radius:12px;background:var(--s-soft);font-size:12px}#sibol .foot{text-align:center;font-size:10px;color:var(--s-muted);padding-top:20px}#sibol .lang{background:var(--s-paper);border:1px solid var(--s-line);border-radius:12px;padding:9px 13px;min-height:44px}#sibol .bigicon{margin:26px auto 20px;border-radius:50%;width:75px;height:75px;display:grid;place-items:center;background:var(--s-soft);color:var(--s-green)}#sibol .bigicon svg{width:33px;height:33px}@media(max-width:360px){#sibol .content{padding:20px 16px}#sibol h1{font-size:26px}#sibol .top{padding-left:16px;padding-right:16px}}
</style>
<div id="sibol" aria-label="Sibol childcare app concept">
<header class="top"><div><div class="brand"><i data-lucide="sprout" aria-hidden="true"></i>sibol<span style="color:var(--s-muted);font-size:12px;letter-spacing:0;margin-left:4px">families</span></div><div class="school">Little Acacia • Quezon City</div></div><button class="iconbutton" data-action="alerts" aria-label="School announcements"><i data-lucide="bell" aria-hidden="true"></i></button></header>
<main class="content" id="sibol-content"></main>
<nav class="nav" aria-label="Main navigation"></nav>
</div>
<script>
(()=>{
const root=document.getElementById('sibol'),main=root.querySelector('main'),nav=root.querySelector('nav');
const design={palette:'Forest',language:'English',rounded:20};
let screen='home',liked=false,paid=false,sent=[],pickup='Lola Rose',notice='';
const icons=(n)=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(s,a,c='action')=>`<button class="${c}" data-action="${a}">${s}</button>`;
const event=(icon,title,desc,time)=>`<div class="row event"><div class="eventicon">${icons(icon)}</div><div class="grow"><strong>${title}</strong><div class="muted">${desc}</div></div><time>${time}</time></div>`;
const safe=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{concept:'Sibol',screen,language:design.language},privateContent:{liked,paid,pickup,sent}}).catch(()=>{});}
function restore(s){if(!s)return;screen=s.modelContent?.screen||'home';design.language=s.modelContent?.language||'English';liked=!!s.privateContent?.liked;paid=!!s.privateContent?.paid;pickup=s.privateContent?.pickup||'Lola Rose';sent=Array.isArray(s.privateContent?.sent)?s.privateContent.sent.slice(-8):[];}
function render(){
const fil=design.language==='Filipino';
root.style.setProperty('--s-green',design.palette==='Ocean'?'light-dark(#286577,#a0d4e1)':'light-dark(#286446,#9fd3ad)');
let html='';
if(screen==='home')html=`<div class="eyebrow">Monday, 21 September</div><h1>${fil?'Magandang umaga,':'Magandang umaga,'}<br>Alex <span style="color:#bf8a38">☀</span></h1><p class="muted">${fil?'Munting sandali. Malaking paglago.':'Little moments. Big growing days.'}</p><section class="panel child"><div class="row"><div class="avatar">🌱</div><div class="grow"><h2>Amara Santos</h2><div class="muted">Nursery • Sampaguita class</div></div><span class="tag">● ${fil?'Nasa paaralan':'At school'}</span></div><div class="rule"></div><div class="row between"><div><div class="eyebrow">${fil?'Dumating':'Checked in'}</div><strong>8:02 AM</strong></div><div style="text-align:right"><div class="eyebrow">${fil?'Susundo':'Today’s pickup'}</div><strong>${safe(pickup)} · 3:00 PM</strong></div></div></section><div class="quick">${btn(icons('user-round-check')+(fil?'Susundo':'Manage pickup'),'pickup','')}${btn(icons('message-circle')+(fil?'Mensahe':'Message teacher'),'messages','')}</div><div class="row between"><h2>${fil?'Araw ni Amara':'Amara’s day'}</h2>${btn(fil?'Tingnan lahat':'View journal','journal','link')}</div>${event('utensils','Merienda, all finished','Banana & pandesal · Water offered','10:15 AM')}${event('palette','A little artist at work','Exploring colors with Teacher Bea','9:30 AM')}${event('sun','A happy hello','Settled in and ready to play','8:10 AM')}<section class="panel notice"><div class="row"><div class="grow"><div class="eyebrow">A little reminder</div><h2 style="margin-top:4px">Family day is this Friday</h2><p class="muted">25 Sep · 9:00 AM · School garden</p></div>${icons('calendar-heart')}</div>${btn('See school announcement →','alerts','link')}</section>`;
if(screen==='journal')html=`<div class="eyebrow">Amara’s little milestones</div><h1>${fil?'Talaarawan':'Daily journal'}</h1><p class="muted">Monday, 21 September · Sampaguita class</p><section class="panel"><div class="row"><div class="avatar" style="font-size:15px">BT</div><div><h2>Teacher Bea</h2><div class="muted">Learning moment · 9:30 AM</div></div></div><div class="postart" role="img" aria-label="Illustration of colorful building blocks"><div class="sun"></div><div class="block round"></div><div class="block tall"></div><div class="block"></div><div class="block blue"></div></div><h2>Small hands, big ideas.</h2><p>Amara built a bahay with her friends today! She named the colors and took turns sharing the blocks.</p><div class="row" style="margin-top:12px"><span class="tag">Creative play</span><span class="tag">Taking turns</span></div>${btn(icons('heart')+' '+(liked?'You loved this moment':'Send a little love'),'like','link')}</section><section class="panel"><h2>Care & comfort</h2>${event('utensils','Merienda','Ate all · Banana & pandesal','10:15 AM')}${event('droplets','Bathroom break','Assisted by Teacher Bea','9:05 AM')}${event('log-in','Checked in','Dropped off by Alex Santos','8:02 AM')}</section>`;
if(screen==='messages')html=`<div class="eyebrow">Sampaguita class</div><h1>${fil?'Mga mensahe':'Messages'}</h1><div class="row" style="margin-top:22px"><div class="avatar" style="font-size:16px">BT</div><div><h2>Teacher Bea</h2><div class="muted">Usually replies during class breaks</div></div></div><p class="muted" style="text-align:center;margin-top:24px">Today · 10:20 AM</p><div class="bubble">Magandang umaga po! Amara enjoyed building with her classmates today. Please bring an extra shirt tomorrow. 🌱</div><div class="muted">Teacher Bea · 10:20 AM</div><div class="bubble mine">Thank you, Teacher! Lola Rose will pick her up at 3 PM today.</div><div class="muted" style="text-align:right">Alex · Read at 10:24 AM</div>${sent.map(s=>`<div class="bubble mine">${safe(s)}</div><div class="muted" style="text-align:right">Preview message · Not sent</div>`).join('')}<form class="compose"><input aria-label="Message to Teacher Bea" placeholder="${fil?'Sumulat ng mensahe…':'Write a message…'}" maxlength="500" required><button class="action" aria-label="Preview sending message">${icons('send')}</button></form><div class="foot">Messages in this concept stay in the preview.</div>`;
if(screen==='fees')html=`<div class="eyebrow">One less thing to worry about</div><h1>${fil?'Mga bayarin':'School fees'}</h1><p class="muted">Amara Santos · School year 2026–27</p><section class="panel"><div class="row between"><span class="eyebrow">September balance</span><span class="tag">${paid?'Demo paid':'Due 25 Sep'}</span></div><div class="amount">${paid?'₱0.00':'₱6,850.00'}</div><p class="muted">Invoice LA-2026-0091</p><div class="rule"></div><div class="row between invoice"><span>Monthly tuition</span><span>₱6,000.00</span></div><div class="row between invoice"><span>Meals & merienda</span><span>₱850.00</span></div>${btn(paid?'View demo receipt':'Choose payment method',paid?'receipt':'pay')}</section><div class="panel"><h2>Previous payments</h2>${event('circle-check','August tuition & meals','Paid 22 Aug · GCash','₱6,850')}${event('circle-check','July tuition & meals','Paid 23 Jul · Bank transfer','₱6,850')}</div><p class="muted" style="text-align:center;margin-top:20px">Your school, your payment options.<br>GCash · Maya · Bank transfer</p>`;
if(screen==='pay')html=`${btn('← School fees','fees','link back')}<div class="eyebrow">September school fees</div><h1>Pay your way.</h1><div class="amount">₱6,850.00</div><p class="muted">Little Acacia Learning Center</p><label class="label" for="sibol-method">Payment method</label><select id="sibol-method"><option>GCash</option><option>Maya</option><option>Bank transfer</option></select><section class="panel"><div class="row between"><span>Invoice total</span><strong>₱6,850.00</strong></div><p class="muted">Sample payment flow. No funds will be moved.</p></section>${btn('Preview payment confirmation','confirm')}<p class="muted" style="margin-top:18px">Payment provider connection and any applicable fees would be shown before a real payment.</p>`;
if(screen==='receipt')html=`${btn('← School fees','fees','link back')}<div class="bigicon">${icons('check')}</div><div style="text-align:center"><div class="eyebrow">Demo receipt</div><h1>All taken care of.</h1><p class="muted">September school fees for Amara</p><div class="amount">₱6,850.00</div></div><section class="panel"><div class="row between invoice"><span>Status</span><span class="tag">Simulated payment</span></div><div class="row between invoice"><span>Invoice</span><span>LA-2026-0091</span></div><p class="muted">This is a design preview, not a payment receipt.</p></section>${btn('Back to Amara’s day','home')}`;
if(screen==='family')html=`<div class="eyebrow">It takes a village</div><h1>${fil?'Ang pamilya':'Your little circle'}</h1><p class="muted">The people helping Amara grow.</p><section class="panel">${event('user-round','Alex Santos','Parent · Billing & school updates','You')}${event('user-round','Miguel Santos','Parent · School updates','')}${event('heart-handshake','Lola Rose','Authorized pickup only','')}</section>${btn('Manage today’s pickup','pickup')}<section class="panel"><div class="row between"><div><h2>App language</h2><div class="muted">English / Filipino</div></div>${btn(fil?'Filipino':'English','language','lang')}</div></section><section class="panel"><h2>Little Acacia Learning Center</h2><p class="muted">Quezon City · Sampaguita class<br>Teacher Bea Torres</p>${btn('Message the school','messages','link')}</section>`;
if(screen==='pickup')html=`${btn('← Amara’s day','home','link back')}<div class="eyebrow">Safe handoffs, happy reunions</div><h1>Who’s picking up?</h1><p class="muted">Today, 21 September · Amara Santos</p><label class="label" for="sibol-pickup">Authorized adult</label><select id="sibol-pickup">${['Lola Rose','Alex Santos','Miguel Santos'].map(n=>`<option ${pickup===n?'selected':''}>${n}</option>`).join('')}</select><div class="panel"><div class="row between"><span>Pickup time</span><strong>3:00 PM</strong></div><div class="rule"></div><p class="muted">Only adults approved by the school can collect Amara. Staff verify identity at pickup.</p></div>${btn('Save pickup arrangement','savepickup')}${notice?`<div class="toast" role="status">${notice}</div>`:''}`;
if(screen==='alerts')html=`${btn('← Back to home','home','link back')}<div class="eyebrow">Little Acacia bulletin</div><h1>School updates</h1><section class="panel notice"><span class="eyebrow">Community · 21 Sep</span><h2 style="margin-top:9px">You’re invited, buong pamilya!</h2><p>Join our Family Day this Friday. Parents and grandparents are welcome for a morning of stories, games, and growing together.</p><div class="rule"></div><strong>25 September · 9:00–11:00 AM</strong><p class="muted">School garden · Bring water and a sun hat</p>${btn(notice==='RSVP saved in this preview.'?'✓ You’re on the sample guest list':'Count us in','rsvp')}</section><section class="panel"><div class="row">${icons('cloud-rain')}<h2>Weather advisories</h2></div><p class="muted">No school suspension posted in this sample. School-issued schedule changes will appear here.</p></section>${notice?`<div class="toast" role="status">${notice}</div>`:''}`;
main.innerHTML=html;const active=['pay','receipt'].includes(screen)?'fees':screen==='pickup'?'family':screen==='alerts'?'home':screen;
nav.innerHTML=[['home','house',fil?'Ngayon':'Today'],['journal','book-open',fil?'Tala':'Journal'],['messages','message-circle',fil?'Usap':'Messages'],['fees','wallet',fil?'Bayarin':'Fees'],['family','users',fil?'Pamilya':'Family']].map(([a,i,t])=>`<button data-action="${a}" class="${active===a?'active':''}" ${active===a?'aria-current="page"':''}>${icons(i)}${t}</button>`).join('');
root.querySelectorAll('.panel').forEach(p=>p.style.borderRadius=design.rounded+'px');if(globalThis.lucide)lucide.createIcons();
}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;notice='';if(a==='like')liked=!liked;else if(a==='language')design.language=design.language==='English'?'Filipino':'English';else if(a==='savepickup'){pickup=root.querySelector('#sibol-pickup').value;notice='Pickup arrangement saved in this preview.';}else if(a==='rsvp')notice='RSVP saved in this preview.';else if(a==='confirm'){paid=true;screen='receipt';}else screen=a;render();save();});
root.addEventListener('submit',e=>{e.preventDefault();const input=e.target.querySelector('input');if(input?.value.trim()){sent.push(input.value.trim());sent=sent.slice(-8);render();save();}});
restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(design,'palette',{label:'Brand palette',options:['Forest','Ocean']});t.addSelect(design,'language',{label:'Navigation language',options:['English','Filipino']});t.addSlider(design,'rounded',{label:'Card corners',min:8,max:26,unit:'px'});}
})();
</script>
