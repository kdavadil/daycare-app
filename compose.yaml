name: sibol
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sibol
      POSTGRES_USER: sibol
      POSTGRES_PASSWORD: local-sibol-only
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-testing.sql:/docker-entrypoint-initdb.d/01-testing.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sibol -d sibol']
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  postgres_data:
